# Список VPS для мониторинга.
# port      — какой TCP-порт проверять на доступность (обычно SSH: 22)
# services  — необязательно. Если указаны и указан SSH-доступ, скрипт
#             логинится по SSH и проверяет их состояние:
#               "nginx"                -> systemctl is-active nginx
#               "proc:python bot.py"   -> pgrep -f "python bot.py"
#               "docker:container-name" -> sudo /usr/local/bin/docker-container-check.sh container-name
#                                          (требует настроенный на VPS wrapper-скрипт + sudoers,
#                                          см. README)
#             Если services не заданы — проверяется только сетевая доступность (TCP-connect).

vps:
  - name: "Nginx-VPS (178.236.240.23)"
    host: "178.236.240.23"
    port: 22
    ssh_user: "monitor"
    ssh_port: 22
    services:
      - nginx

  - name: "Docker-VPS (62.60.244.114)"
    host: "62.60.244.114"
    port: 22
    ssh_user: "monitor"
    ssh_port: 22
    services:
      - "docker:tg_project-tgbot-1"
      - "docker:n8n-n8n-1"
      - "docker:tutor-cabinet-backend-1"
      - "docker:tutor-cabinet-frontend-1"
      - "docker:tutor-cabinet-postgres-1"
      - "docker:tutor-cabinet-redis-1"

# Список сайтов для HTTP-проверки. Проверяется публичный домен по сети
# (не напрямую IP VPS) — GET-запрос, "ок" считается любой ответ с кодом
# < 500 (сервер отвечает; 404/redirect на логин и т.п. не считается падением).
# Список собран автоматически по server_name из nginx-конфигов на обеих VPS.
